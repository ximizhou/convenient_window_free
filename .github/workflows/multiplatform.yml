name: macOS and Linux X11

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux X11 and Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxtst-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libwayland-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev x11-utils xvfb

      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Frontend tests, checks, and build
        shell: bash
        run: |
          npm ci --prefix apps/desktop
          npm --prefix apps/desktop run check
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build

      - name: Start X11 display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/convenient-window-xvfb.log 2>&1 &
          echo $! >/tmp/convenient-window-xvfb.pid
          for attempt in {1..30}; do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          DISPLAY=:99 xdpyinfo >/dev/null

      - name: Helper format and native tests
        shell: bash
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
          XDG_SESSION_TYPE: ${{ runner.os == 'Linux' && 'x11' || '' }}
        run: |
          cargo +stable fmt --manifest-path helper/Cargo.toml --check
          cargo +stable test --manifest-path helper/Cargo.toml --target "${{ matrix.target }}"

      - name: Tauri host tests and native compilation
        shell: bash
        run: |
          cargo +stable test --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.target }}"
          cargo +stable check --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.target }}"

      - name: Linux X11 helper IPC and lock smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          DISPLAY: :99
          XDG_SESSION_TYPE: x11
        run: |
          cargo +stable build --manifest-path helper/Cargo.toml --target "${{ matrix.target }}" --release
          node scripts/helper-instance-smoke.mjs "helper/target/${{ matrix.target }}/release/magic-corners-helper"

      - name: Stop X11 display
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if test -f /tmp/convenient-window-xvfb.pid; then
            xvfb_pid="$(cat /tmp/convenient-window-xvfb.pid)"
            if kill -0 "$xvfb_pid" 2>/dev/null; then kill "$xvfb_pid"; fi
          fi
